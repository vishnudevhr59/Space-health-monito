version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ml-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    ports:
      - "5050:5050"
    restart: unless-stopped
